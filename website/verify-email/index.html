<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foody — Email verified</title>
    <meta name="description" content="Your foody email address has been verified. Return to the app to sign in." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark wordmark--header" href="/" aria-label="foody home">
          <span>foody</span>
          <span class="wordmark__dot" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <main class="main">
      <section class="info-section">
        <div class="info-card">
          <h2>Email verified</h2>
          <p class="body info-card__body">
            Your email has been verified! You can now return to the foody app and sign in.
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="body-small">© foody</p>
    </footer>
  </body>
</html>
